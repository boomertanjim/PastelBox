        <div class="searchHeader">
          <h2>Playlist</h2>
          <input id="search" type="text" placeholder="Find Songs..." />

    <div class="musicPlayer">
      <div class="vinyl">
        <img src="sprites/coverDummy.jpg" class="albumArt" id="cover" alt="" />
      </div>
      <div>
        <h1 id="title">No Song Playing</h1>
        <h3 id="artist">Unknown Artist</h3>
      </div>

      <div class="volume">
        <input id="playbackRange" type="range" value="0" min="0" max="100" />
        <progress id="playbackProgress" value="0" min="0" max="100"></progress>
      </div>
      <div class="controls">
        <div>
          <button class="btn playPause" onclick="playPause()">
            <img src="sprites/play.svg" alt="" id="change" />
          </button>
          <button class="btn next">
            <img src="sprites/next.svg" alt="" />
          </button>
          <button class="btn loop">
            <img src="sprites/loop.svg" alt="" />
          </button>
        </div>

        <div class="volume">
          <input
            id="range"
            type="range"
            value="50"
            min="0"
            max="100"
            onmousemove="vol()"
            onclick="vol()"
            onmouseup="vol()"
            onmousedown="vol()"
          />
          <progress id="progress" value="50" min="0" max="100"></progress>
        </div>
      </div>
    </div>

      <div id="queue">

          <h2>Current Queue</h2>
